name: ai-proxy-kit

services:
  antigravity:
    profiles: [antigravity]
    image: ${ANTIGRAVITY_IMAGE:-lbjlaq/antigravity-manager:v5.0.3}
    ports: ["0.0.0.0:${ANTIGRAVITY_PORT:-8045}:8045"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      API_KEY: ${ANTIGRAVITY_API_KEY:?Run install.sh first}
      WEB_PASSWORD: ${ANTIGRAVITY_WEB_PASSWORD:?Run install.sh first}
      ABV_AUTH_MODE: all_except_health
      ABV_BIND_LOCAL_ONLY: "false"
      ABV_DATA_DIR: /root/.antigravity_tools
      HTTP_PROXY: ${UPSTREAM_PROXY:-}
      HTTPS_PROXY: ${UPSTREAM_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,::1,antigravity,workbuddy,sub2api
    volumes:
      - ${ANTIGRAVITY_DATA_DIR:-./runtime/antigravity}:/root/.antigravity_tools
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  workbuddy:
    profiles: [workbuddy]
    image: ${WORKBUDDY_IMAGE:-ghcr.io/linguo2625469/workbuddy2api-panel:1.13.0}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    entrypoint: [/app/wb2api, -config, /config/config.json]
    ports: ["0.0.0.0:${WORKBUDDY_PORT:-7863}:7863"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WB2A_LISTEN: 0.0.0.0:7863
      WB2A_API_KEY: ${WORKBUDDY_API_KEY:?Run install.sh first}
      WB2A_AUTH_DIR: /config/auths
      WB2A_STATE_FILE: /config/data/state.json
      HTTP_PROXY: ${UPSTREAM_PROXY:-}
      HTTPS_PROXY: ${UPSTREAM_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,::1,antigravity,workbuddy,sub2api
    volumes:
      - ./runtime/workbuddy:/config
    restart: unless-stopped
    logging: *logging

  sub2api:
    profiles: [sub2api]
    image: ${SUB2API_IMAGE:-weishaw/sub2api:0.2.23}
    ports: ["0.0.0.0:${SUB2API_PORT:-8080}:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Run install.sh first}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run install.sh first}
      ADMIN_EMAIL: ${SUB2API_EMAIL:-admin@sub2api.local}
      ADMIN_PASSWORD: ${SUB2API_PASSWORD:?Run install.sh first}
      JWT_SECRET: ${JWT_SECRET:?Run install.sh first}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Run install.sh first}
      SECURITY_URL_ALLOWLIST_ENABLED: "false"
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: "true"
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: "true"
      TZ: ${TZ:-Asia/Shanghai}
    volumes: ["sub2api-data:/app/data"]
    restart: unless-stopped
    logging: *logging

  postgres:
    profiles: [sub2api]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_DB: sub2api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run install.sh first}
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sub2api -d sub2api"]
      interval: 3s
      timeout: 3s
      retries: 60
    restart: unless-stopped
    logging: *logging

  redis:
    profiles: [sub2api]
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run install.sh first}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run install.sh first}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: ["redis-data:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 60
    restart: unless-stopped
    logging: *logging

  aistudio:
    profiles: [aistudio]
    image: ${AISTUDIO_IMAGE:-ibuhub/aistudio-to-api:v1.4.1}
    ports: ["0.0.0.0:${AISTUDIO_PORT:-7860}:7860"]
    environment:
      API_KEYS: ${AISTUDIO_API_KEY:?Run install.sh first}
      HOST: 0.0.0.0
      PORT: "7860"
      WEB_CONSOLE_PASSWORD: ${AISTUDIO_WEB_PASSWORD:?Run install.sh first}
      TZ: ${TZ:-Asia/Shanghai}
      HTTP_PROXY: ${UPSTREAM_PROXY:-}
      HTTPS_PROXY: ${UPSTREAM_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,::1,antigravity,workbuddy,sub2api
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./runtime/aistudio/auth:/app/configs/auth
      - ./runtime/aistudio/data:/app/data
    shm_size: 1gb
    restart: unless-stopped
    logging: *logging

  aistudio2api:
    profiles: [aistudio2api]
    image: ${AISTUDIO2API_IMAGE:-ghcr.io/mag1cfall/aistudio2api:latest}
    ports: ["0.0.0.0:${AISTUDIO2API_PORT:-2048}:2048"]
    environment:
      LISTEN_ADDR: 0.0.0.0:2048
      PREVIEW_LISTEN_ADDR: 0.0.0.0:2051
      AISTUDIO_AUTH_STATES: /data/auth
      PROXY_API_KEY: ${AISTUDIO2API_API_KEY:?Run install.sh first}
      ADMIN_AUTH_ENABLED: ${AISTUDIO2API_ADMIN_AUTH:-false}
      ADMIN_USERNAME: ${AISTUDIO2API_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${AISTUDIO2API_ADMIN_PASSWORD:-}
      UPSTREAM_CHANNELS: ${AISTUDIO2API_CHANNELS:-playground}
      WAA_BACKEND: ${AISTUDIO2API_WAA_BACKEND:-spidermonkey}
      AUTO_START: "true"
      TZ: ${TZ:-Asia/Shanghai}
      HTTP_PROXY: ${UPSTREAM_PROXY:-}
      HTTPS_PROXY: ${UPSTREAM_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,::1,antigravity,workbuddy,sub2api
    volumes:
      - ./runtime/aistudio2api/data:/data
    shm_size: 1gb
    restart: unless-stopped
    logging: *logging

volumes:
  sub2api-data:
  postgres-data:
  redis-data:
