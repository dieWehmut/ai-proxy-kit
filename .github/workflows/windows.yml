name: Windows PowerShell checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and verify installer functions
        shell: powershell
        run: ./tests/Test-Functions.ps1

  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and verify installer functions
        shell: pwsh
        run: ./tests/Test-Functions.ps1
